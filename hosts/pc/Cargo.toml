[package]
name = "lvguo-pc"
version = "3.0.0"
edition = "2021"
description = "绿果 PC 桌面宿主：动态加载单文件 lvguo-core，复用统一 Web UI 与原生 GPU mpv 播放窗口"
license = "GPL-3.0"

[[bin]]
name = "lvguo-pc"
path = "src/main.rs"

[dependencies]
dirs = "5"
lvguo-host-common = { path = "../common" }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tao = "0.38"
wry = { version = "0.58", default-features = false }
